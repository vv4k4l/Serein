name: Hitora Windows build
# Personal-fork build: packages the Windows app on every push to this branch.
# It skips the project's test suite; run `native-client` for the full checks.
on:
  push:
    branches: [hitora-rebrand]
  workflow_dispatch:
concurrency:
  group: hitora-windows-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-on-failure: true
      - name: Package app without demo or developer features
        run: cargo xtask package
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: hitora-windows-x64-unsigned
          path: dist/
          if-no-files-found: error
          retention-days: 14
